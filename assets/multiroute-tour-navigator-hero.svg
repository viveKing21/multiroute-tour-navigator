<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" width="900" height="280">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#0e1f14"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
    <linearGradient id="accent2b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0091ea"/>
      <stop offset="100%" stop-color="#40c4ff"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg2)"/>

  <!-- Glow blobs -->
  <ellipse cx="700" cy="140" rx="200" ry="130" fill="#00c853" opacity="0.07" filter="url(#glow2)"/>
  <ellipse cx="820" cy="60" rx="100" ry="80" fill="#0091ea" opacity="0.1" filter="url(#glow2)"/>

  <!-- Route A (top path) -->
  <path d="M500,70 Q560,50 620,70 Q680,90 740,70 Q800,50 850,80" 
        fill="none" stroke="#00c853" stroke-width="2" stroke-dasharray="8,5" opacity="0.7"/>
  
  <!-- Route B (bottom path) -->
  <path d="M500,170 Q560,190 620,170 Q680,150 740,170 Q800,190 850,160" 
        fill="none" stroke="#0091ea" stroke-width="2" stroke-dasharray="8,5" opacity="0.7"/>

  <!-- Connection bridge between routes -->
  <line x1="680" y1="80" x2="680" y2="160" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4" opacity="0.25"/>
  <text x="690" y="125" font-family="monospace" font-size="8" fill="#ffffff" opacity="0.4">persist</text>

  <!-- Route A nodes -->
  <circle cx="500" cy="70" r="10" fill="#0d1117" stroke="#00c853" stroke-width="2"/>
  <circle cx="500" cy="70" r="5" fill="#00c853"/>
  <circle cx="620" cy="70" r="10" fill="#0d1117" stroke="#00c853" stroke-width="2"/>
  <circle cx="620" cy="70" r="5" fill="#00c853"/>
  <circle cx="740" cy="70" r="10" fill="#0d1117" stroke="#00c853" stroke-width="2"/>
  <circle cx="740" cy="70" r="5" fill="#00c853"/>

  <!-- Route B nodes -->
  <circle cx="500" cy="170" r="10" fill="#0d1117" stroke="#0091ea" stroke-width="2"/>
  <circle cx="500" cy="170" r="5" fill="#40c4ff"/>
  <circle cx="620" cy="170" r="10" fill="#0d1117" stroke="#0091ea" stroke-width="2"/>
  <circle cx="620" cy="170" r="5" fill="#40c4ff"/>
  <circle cx="740" cy="170" r="10" fill="#0d1117" stroke="#0091ea" stroke-width="2"/>
  <circle cx="740" cy="170" r="5" fill="#40c4ff"/>

  <!-- Route labels -->
  <rect x="487" y="44" rx="4" ry="4" width="52" height="16" fill="#00c853" opacity="0.15" stroke="#00c853" stroke-width="1"/>
  <text x="513" y="55" font-family="monospace" font-size="8" fill="#00e676" text-anchor="middle">/home</text>

  <rect x="607" y="44" rx="4" ry="4" width="56" height="16" fill="#00c853" opacity="0.15" stroke="#00c853" stroke-width="1"/>
  <text x="635" y="55" font-family="monospace" font-size="8" fill="#00e676" text-anchor="middle">/about</text>

  <rect x="727" y="44" rx="4" ry="4" width="60" height="16" fill="#00c853" opacity="0.15" stroke="#00c853" stroke-width="1"/>
  <text x="757" y="55" font-family="monospace" font-size="8" fill="#00e676" text-anchor="middle">/settings</text>

  <rect x="487" y="183" rx="4" ry="4" width="52" height="16" fill="#0091ea" opacity="0.15" stroke="#40c4ff" stroke-width="1"/>
  <text x="513" y="194" font-family="monospace" font-size="8" fill="#40c4ff" text-anchor="middle">/dash</text>

  <rect x="607" y="183" rx="4" ry="4" width="60" height="16" fill="#0091ea" opacity="0.15" stroke="#40c4ff" stroke-width="1"/>
  <text x="637" y="194" font-family="monospace" font-size="8" fill="#40c4ff" text-anchor="middle">/profile</text>

  <rect x="727" y="183" rx="4" ry="4" width="56" height="16" fill="#0091ea" opacity="0.15" stroke="#40c4ff" stroke-width="1"/>
  <text x="755" y="194" font-family="monospace" font-size="8" fill="#40c4ff" text-anchor="middle">/reports</text>

  <!-- React Router badge top right -->
  <rect x="820" y="210" rx="6" ry="6" width="68" height="20" fill="#1a2332" stroke="#40c4ff" stroke-width="1"/>
  <text x="854" y="223" font-family="monospace" font-size="8" fill="#40c4ff" text-anchor="middle">React Router</text>

  <!-- Left: title block -->
  <rect x="48" y="55" width="4" height="70" rx="2" fill="url(#accent2)"/>
  <text x="68" y="83" font-family="Georgia, serif" font-size="22" fill="#ffffff" font-weight="700">multiroute-</text>
  <text x="68" y="110" font-family="Georgia, serif" font-size="22" fill="#00e676" font-weight="700">tour-navigator</text>
  <text x="68" y="132" font-family="monospace" font-size="12" fill="#40c4ff">React Router · Persistent State · Multi-page</text>

  <!-- Tagline -->
  <text x="68" y="165" font-family="Georgia, serif" font-size="13" fill="#b0bec5" opacity="0.9">Tours that survive page navigation.</text>
  <text x="68" y="183" font-family="Georgia, serif" font-size="13" fill="#b0bec5" opacity="0.9">Built on tour-navigator · Cross-route step tracking.</text>

  <!-- Badges -->
  <rect x="68" y="205" rx="10" ry="10" width="80" height="20" fill="#00c853" opacity="0.12" stroke="#00c853" stroke-width="1"/>
  <text x="108" y="218" font-family="monospace" font-size="8" fill="#00e676" text-anchor="middle">npm install</text>

  <rect x="158" y="205" rx="10" ry="10" width="56" height="20" fill="#0091ea" opacity="0.12" stroke="#40c4ff" stroke-width="1"/>
  <text x="186" y="218" font-family="monospace" font-size="8" fill="#40c4ff" text-anchor="middle">MIT License</text>

  <rect x="224" y="205" rx="10" ry="10" width="74" height="20" fill="#a78bfa" opacity="0.1" stroke="#a78bfa" stroke-width="1"/>
  <text x="261" y="218" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">1,400+ downloads</text>

  <!-- Bottom bar -->
  <rect x="0" y="270" width="900" height="10" fill="url(#accent2)" opacity="0.4"/>
  <rect x="0" y="270" width="450" height="10" fill="url(#accent2b)" opacity="0.4"/>
</svg>
